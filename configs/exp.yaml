methods: [cleansweep, guard_tests_only, tools_only, one_shot_llm, no_ranker, no_batching]
seeds:
  llm: [0, 1, 2]
  tools_only: [0]
batch_max_size: 8
scheduler:
  every_n: 5
  adaptive_threshold: 0.02
hidden_stability_runs: 3  # SWE-bench hidden checks: runs of the PatchDiff tests before the diff; unstable tests are dropped
one_shot_extra_body:     # one_shot_llm requests: reasoning off, like the Guard's probes
  chat_template_kwargs:
    enable_thinking: false
