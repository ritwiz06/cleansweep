leftover_patterns: ["reproduce*", "debug*", "scratch*", "tmp*", "*_old.py", "*_v[0-9].py",
                    "*backup*", "*.bak", "*.orig"]
vulture_min_confidence: 60
duplicate_threshold: 0.8
security_min_severity: MEDIUM
judge_batch_size: 10
snippet_context_lines: 10
# How much say the LLM judge has over lanes:
#   gatekeeper: "suggest" and "keep" move items to the suggest lane (they are not applied)
#   advisory:   the judge only adds its reason and confidence; lanes stay as the
#               detectors set them and the Guard decides (security items stay in suggest)
judge_mode: gatekeeper
# Over-engineering review (one extra LLM prompt): reports extra checks, needless abstractions,
# unused parameters and impossible-case code as report_only items in the suggest lane.
# Reads agent-written files when the features mark them, else all non-test .py files (capped).
# CLEANSWEEP_OVERENGINEERING=0 turns it off for one run.
overengineering: true
overengineering_max_files: 20
overengineering_budget_chars: 5000
scope: auto   # agent = only what the agent patch wrote; repo = everything; auto = agent for swebench: targets
# Dead code on a public name in a package module (no leading underscore, folder with __init__.py,
# not a test, script or example) goes to the suggest lane: with no caller in the project the Guard
# has nothing to run, and only the owner knows whether it is used outside.
#   on | off | auto (on when the repo has packaging metadata: setup.py, setup.cfg or pyproject)
keep_public_api: auto
# Methods a framework calls by name (Textual's compose and on_*, Django's get_queryset, Click's
# invoke, ...; the table is in src/cleansweep/analysis/frameworks.py) go to the suggest lane:
# nothing in the project calls them, so neither the graph nor the Guard can see that they are used.
#   on | off
framework_callbacks: on
# The agent team only (v1's plan never applies it): dead code and duplicates on units something
# reaches by name go to the suggest lane with the evidence. Entry points, names in config files
# and settings lists, decorator registries, __all__, getattr/import_module with literal strings,
# __subclasses__() discovery, framework base classes (src/cleansweep/analysis/dynamic_refs.py).
#   on | off
dynamic_refs: on
# Folders or files the Reviewer leaves alone (path prefixes), e.g. [tests/fixtures/, demo/]
exclude: []
