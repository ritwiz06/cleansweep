# Paths are relative to the repository root.
swebench:
  dataset: SWE-bench/SWE-bench_Verified   # new home of princeton-nlp/SWE-bench_Verified
  split: test
  cache: data/raw/swebench_verified.parquet
patchdiff:
  repo_url: https://github.com/ZJU-CTAG/PatchDiff
  commit: 0a8ed608f9f19396e1bb3f6f3dd88b0fb88b49d6   # pinned; holds the three agents' patches
  dir: data/raw/patchdiff
  results_url: https://zenodo.org/api/records/17074796/files/PatchDiff_0908.7z/content
  results_sha256: 26366405ba37cb3f8052ddd49e23f62e11925dc4a5512744cf03037d30e9204a
  results_dir: data/raw/patchdiff_zenodo   # labels and generated tests (the paper's results)
  index: data/processed/patchdiff_index.json
  tests_dir: data/processed/patchdiff_tests
  max_hidden_tests: 10                      # per patch; tests that revealed a difference first
  agents:                                   # PatchDiff's tool name -> its submission folder (glob)
    OpenHands: 20241029_OpenHands-CodeAct-*
    CodeStory: 20241221_codestory_midwit_*
    LearnByInteract: 20250110_learn_by_interact_*
splits:
  dir: data/splits
  tier1_patches: 10
  tier2_patches: 60
  tier3_tasks: 150
  differs_share: 0.3
  # small environments and quick test commands first; round-robin over these repos
  repo_preference: [pytest-dev/pytest, django/django, sympy/sympy, pydata/xarray, sphinx-doc/sphinx]
aidev:
  dir: data/raw/aidev                  # AIDev-pop tables from hao-li/AIDev (repository, pull_request, pr_review_comments, pr_commits)
  clones: data/raw/aidev/repos         # blobless clones of the candidates
  min_agent_prs: 10                    # merged agent pull requests per repository
  max_candidates: 120                  # seeded random sample of the Python repos that qualify
  seed: 0
  min_pass_rate: 0.9
  min_tests: 5
  max_test_seconds: 600
  install_timeout_s: 600
  select_hours: 3
  workers: 2
  target_repos: 40                     # stop once this many are kept
  excluded_runnable: 1                 # runnable repos left out of committed files (name rejected by the commit hook; DECISIONS)
  history_commits: 300
  history_cache: data/processed/aidev_history
  scope_history_cache: data/processed/aidev_scope_history  # longer first-parent windows for the agent scope only (repos with no agent commit in the last 300; DECISIONS)
  labels: data/processed/aidev_labels.parquet
  slop_cache: data/processed/aidev_slop  # per-commit static slop for the Scheduler replay

aidev_v3:                              # v3 repository set (scripts/data/data_v3_select.py)
  max_candidates: 360                  # the same seeded sample as aidev, made larger; v2's 116 are a prefix of it
  licenses: [MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, GPL-3.0, GPL-2.0, AGPL-3.0, LGPL-3.0, MIT-0, CC0-1.0, CC-BY-4.0, CC-BY-SA-4.0, ODbL-1.0]   # allow local use; NOASSERTION and none are left out
  workers: 3
  select_hours: 7
  target_new_kept: 45                  # stop once this many new candidates pass the screen
  seed: 4
  inject: 10                           # new repositories for injection (seed 4)
  real: 15                             # new repositories for the real-project evaluation
  real_two_runs: 5                     # the first five REAL repositories run twice (variance)
  min_py_files: 8
  max_test_seconds: 300
  autonomy: 30
  autonomy_quotas: {no_tests: 4, unittest: 4, src_layout: 4, poetry_uv: 4, notebooks: 3, monorepo: 2, install_failed: 4, tox_nox_make: 2}
