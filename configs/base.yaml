core:
  out_dir: results/raw
  llm:
    enabled: auto          # auto = use Voyager only when VOYAGER_API_KEY is set
    base_url_env: VOYAGER_BASE_URL
    api_key_env: VOYAGER_API_KEY
    model_env: VOYAGER_MODEL
    alt_model_env: VOYAGER_MODEL_ALT
    cache_path: .cleansweep/llm_cache.sqlite
    max_retries: 2          # retries for 429, 5xx (incl. 524) and dropped connections; timeouts are not retried
    timeout_s: 600
    extra_body: null       # provider options for every request (probes add their own)
    max_calls: null        # stop with LLMError after this many requests (cache hits are free)
  sandbox:
    work_dir: null         # null = <system temp>/cleansweep/ws
    quarantine_dir: .cleansweep/quarantine
    test_timeout_s: 900
    flaky_runs: 3          # SWE-bench: baseline runs at open; tests that change status are ignored
    platform: linux/amd64  # SWE-bench images are x86_64 (emulated on arm64)
  guard:
    diff_tests: true       # differential probes after the tests pass; guard_tests_only turns them off
    probe_mode: auto       # direct (harness as a script) | runner (inside the project's test command) | auto: runner for swebench/aidev, direct for local folders
    probe_runner_directives: true  # runner mode on SWE-bench: run the instance's own test files too, so the setup matches
    probe_runner_timeout_s: 900
    max_targets: 10        # functions probed per batch (removed copies, changed functions, callers)
    probe_max_cases: 8
    probe_timeout_s: 300   # one harness run
    probe_case_timeout_s: 10
    probe_cache_dir: .cleansweep/probes
    probe_extra_body:      # sent with probe requests only: reasoning off (issue #5)
      chat_template_kwargs:
        enable_thinking: false
    repair: true
  agents:                  # v2 agent team (method=agentic, `cleansweep clean`); docs/agentic_design.md
    mode: safe             # safe: deterministic edits, anything uncertain is suggested | thorough
    manager: llm           # llm: the Manager also asks the LLM at each phase boundary (hard rules win) | rules
    manager_budget: {llm_calls: 12}  # the LLM-guided Manager's decisions; the run budget caps time
    ablation: null         # no_research | broadcast | inline_artifacts | no_lessons | no_coverage | single_agent
    investigate: all       # all | adaptive: only uncertain candidates go to an Investigator, the rest by rules | none
    investigate_batch: off # on: candidates with the same pattern share one Investigator request (at most 5),
                           # and a suggest/drop verdict is reused for an identical pattern | off
    parallel_llm: 3        # LLM requests at once (Investigators)
    baseline_runs: 3       # test runs for the baseline (flaky tests are those that change)
    related_first_s: 20    # run related tests before the full suite when the suite takes longer
    full_suite_max_s: 120  # slower suites: related tests per package, the full suite in FINAL VERIFY
    install: auto          # auto: install the project into .cs_venv when it has packaging files | off
    no_tests: null         # no usable tests: probes (clean's default): apply only probe-covered
                           # edits | plan (experiments' default): deliver the plan as suggestions
    notebooks: null        # hold (clean's default): what a notebook names stays a suggestion | ignore
    max_package: 4         # edits per work package
    format_policy: enforced  # enforced: formatting is safe only if CI or pre-commit runs ruff format
                           # or black, else a suggestion | always
    lessons_file: null     # keep lessons across runs in this JSON-lines file
    knowledge_dir: null    # mined results; null = results/data_summary
    budget:                # the whole run (`--budget llm=N,minutes=N,tests=N`)
      llm_calls: 150
      minutes: 60
      test_runs: 120
    explorer: {steps: 6, llm_calls: 4, seconds: 300}
    auditor: {steps: 6, llm_calls: 2, seconds: 300}
    investigator: {steps: 6, llm_calls: 6, seconds: 600}
    planner: {steps: 8, llm_calls: 3, seconds: 300}
    engineer: {steps: 8, llm_calls: 2, seconds: 300}
    tester: {steps: 6, llm_calls: 0, seconds: 1800}
    validator: {steps: 6, llm_calls: 3, seconds: 600}
    fixer: {steps: 4, llm_calls: 2, seconds: 600, turns: 2}
    reporter: {steps: 4, llm_calls: 2, seconds: 300}
