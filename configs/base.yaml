core:
  out_dir: results/raw
  llm:
    enabled: auto          # auto = use Voyager only when VOYAGER_API_KEY is set
    base_url_env: VOYAGER_BASE_URL
    api_key_env: VOYAGER_API_KEY
    model_env: VOYAGER_MODEL
    alt_model_env: VOYAGER_MODEL_ALT
    cache_path: .cleansweep/llm_cache.sqlite
    max_retries: 5
    timeout_s: 600
    extra_body: null       # provider options for every request (probes add their own)
  sandbox:
    work_dir: null         # null = <system temp>/cleansweep/ws
    quarantine_dir: .cleansweep/quarantine
    test_timeout_s: 900
    flaky_runs: 3          # SWE-bench: baseline runs at open; tests that change status are ignored
    platform: linux/amd64  # SWE-bench images are x86_64 (emulated on arm64)
  guard:
    diff_tests: true       # differential probes after the tests pass; guard_tests_only turns them off
    probe_mode: auto       # direct (harness as a script) | runner (inside the project's test command) | auto: runner for swebench/aidev, direct for local folders
    probe_runner_directives: true  # runner mode on SWE-bench: run the instance's own test files too, so the setup matches
    probe_runner_timeout_s: 900
    max_targets: 10        # functions probed per batch (removed copies, changed functions, callers)
    probe_max_cases: 8
    probe_timeout_s: 300   # one harness run
    probe_case_timeout_s: 10
    probe_cache_dir: .cleansweep/probes
    probe_extra_body:      # sent with probe requests only: reasoning off (issue #5)
      chat_template_kwargs:
        enable_thinking: false
    repair: true
